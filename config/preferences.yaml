# Short title signals catch legitimate variants that do not exactly match the titles above.
job_category_keywords:
  primary:
    - embedded software
    - embedded systems
    - embedded linux
    - firmware
    - systems software
    - hardware validation
    - hardware test
    - systems integration
    - integration and test
    - electronics test
    - flight software
  stretch:
    - design verification
    - asic verification
    - fpga
    - digital design
    - silicon validation
  backup:
    - c++ software
    - computer vision
    - robotics software
    - robotic software
    - manufacturing test
    - embedded products

locations:
  preferred_keywords: [San Francisco, Bay Area, California, CA, Remote, United States, US]
  relocation_keywords: [relocation, relocation assistance, relocation available]
  allow_remote_us: true

employment:
  preferred: [full-time, full time]
  acceptable: [internship, intern, contract-to-hire, contract to hire]

eligibility:
  reject_seniority_keywords: [senior, sr, staff, principal, lead, manager, director, chief, head, vice president, vp]
  unrelated_title_keywords: [frontend, front-end, full stack, full-stack, backend, web developer, web designer, ui engineer, android engineer, sales, account executive, help desk, help-desk, it support, legal counsel, recruiter, human resources, facilities, warehouse, supply chain, business operations, finance, accountant, marketing]
  entry_level_keywords: [entry level, entry-level, junior, associate, new grad, new graduate, engineer i, engineer ii, internship, intern]
  reject_experience_years: 5
  flag_experience_years: 2
  allow_experience_override: false

scoring:
  weights:
    fit: 0.40
    competitiveness: 0.25
    preference: 0.20
    recency: 0.15
  recommendation_thresholds:
    apply_immediately: 80
    good_match: 65
    stretch_application: 45
  recency_full_score_days: 7
  recency_zero_score_days: 90

posting_health:
  freshness_buckets:
    - [1, 100, "<1 day"]
    - [4, 90, "1-3 days"]
    - [8, 78, "4-7 days"]
    - [15, 62, "8-14 days"]
    - [31, 42, "15-30 days"]
    - [1000000, 20, "30+ days"]

priority:
  weights:
    technical_fit: 0.50
    role_preference: 0.22
    freshness: 0.12
    historical_conversion: 0.07
    posting_health: 0.05
    company_saturation: 0.02
    application_effort: 0.02
  manual_review_penalty: 15

follow_up:
  minimum_business_days: 5
  urgent_business_days: 8
  late_business_days: 12
  stale_business_days: 15
  max_unsolicited_follow_ups: 1
  allow_second_follow_up: false
  follow_up_spacing_business_days: 5
  # Optional YYYY-MM-DD values; weekends are always excluded automatically.
  holidays: []
